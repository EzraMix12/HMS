<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseClinic - Dashboard & Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="bg-sky-500 text-white p-2 rounded-xl shadow-sm"><i class="fa-solid fa-house-medical text-lg"></i></div>
                <span class="font-bold text-lg text-slate-900">Pulse<span class="text-sky-500">Clinic</span></span>
            </a>
            <nav class="hidden md:flex items-center space-x-1">
                <a href="index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Home</a>
                <a href="dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-sky-600 bg-sky-50">Dashboard & Queue</a>
                <a href="registry.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Patient Registry</a>
                <a href="emr.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Consultation (EMR)</a>
                <a href="billing.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Billing & Cashier</a>
            </nav>
            <div class="text-xs font-semibold text-slate-800">Dr. Sarah Jenkins</div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <!-- Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div><p class="text-xs font-semibold uppercase text-slate-500">Total Today</p><h4 class="text-2xl font-bold text-slate-900 mt-1" id="stat-total">0</h4></div>
                <div class="w-10 h-10 bg-sky-50 text-sky-600 rounded-lg flex items-center justify-center"><i class="fa-solid fa-user-group"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div><p class="text-xs font-semibold uppercase text-slate-500">Waiting</p><h4 class="text-2xl font-bold text-amber-600 mt-1" id="stat-waiting">0</h4></div>
                <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-lg flex items-center justify-center"><i class="fa-solid fa-clock"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div><p class="text-xs font-semibold uppercase text-slate-500">In Consultation</p><h4 class="text-2xl font-bold text-sky-600 mt-1" id="stat-consulting">0</h4></div>
                <div class="w-10 h-10 bg-sky-50 text-sky-600 rounded-lg flex items-center justify-center"><i class="fa-solid fa-stethoscope"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div><p class="text-xs font-semibold uppercase text-slate-500">Completed</p><h4 class="text-2xl font-bold text-emerald-600 mt-1" id="stat-completed">0</h4></div>
                <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center"><i class="fa-solid fa-circle-check"></i></div>
            </div>
        </div>

        <!-- Queue Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-900">Live Waiting Queue</h2>
                <button onclick="openModal()" class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i> Add Patient to Queue
                </button>
            </div>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold border-b border-slate-200">
                        <th class="p-4">Queue #</th><th class="p-4">Patient Name</th><th class="p-4">Doctor</th><th class="p-4">Purpose</th><th class="p-4">Status</th><th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="queue-tbody" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="queue-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3"><h3 class="font-bold text-slate-900">Add Patient to Queue</h3><button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
            <form onsubmit="addQueue(event)" class="space-y-3 text-sm">
                <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Select Patient</label><select id="q-patient" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg"></select></div>
                <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Purpose</label><input type="text" id="q-purpose" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg" placeholder="General Checkup..."></div>
                <div class="pt-3 flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-lg">Cancel</button><button type="submit" class="px-4 py-2 bg-sky-500 text-white rounded-lg">Add</button></div>
            </form>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        function renderDashboard() {
            const queue = getQueue();
            const tbody = document.getElementById('queue-tbody');
            tbody.innerHTML = '';
            let w=0, c=0, cp=0;
            queue.forEach(q => {
                if(q.status==='Waiting') w++;
                if(q.status==='Consultation') c++;
                if(q.status==='Completed') cp++;

                let badge = q.status==='Waiting'?'bg-amber-100 text-amber-700':q.status==='Consultation'?'bg-sky-100 text-sky-700':'bg-emerald-100 text-emerald-700';
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-4 font-bold">#${q.qNo}</td><td class="p-4 font-medium">${q.name}</td><td class="p-4 text-slate-600">${q.doctor}</td><td class="p-4 text-slate-600">${q.purpose}</td>
                        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badge}">${q.status}</span></td>
                        <td class="p-4 text-right space-x-2">
                            <button onclick="advance(${q.qNo})" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg">Advance</button>
                            <button onclick="removeQ(${q.qNo})" class="text-xs text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
            document.getElementById('stat-total').innerText = queue.length;
            document.getElementById('stat-waiting').innerText = w;
            document.getElementById('stat-consulting').innerText = c;
            document.getElementById('stat-completed').innerText = cp;
        }
        function openModal() {
            const patients = getPatients();
            const sel = document.getElementById('q-patient');
            sel.innerHTML = patients.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            document.getElementById('queue-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('queue-modal').classList.add('hidden'); }
        function addQueue(e) {
            e.preventDefault();
            const pId = parseInt(document.getElementById('q-patient').value);
            const patient = getPatients().find(p => p.id === pId);
            const queue = getQueue();
            queue.push({ qNo: queue.length ? Math.max(...queue.map(q => q.qNo))+1 : 101, patientId: pId, name: patient.name, doctor: 'Dr. Sarah Jenkins', purpose: document.getElementById('q-purpose').value, status: 'Waiting' });
            saveQueue(queue);
            closeModal();
            renderDashboard();
        }
        function advance(qNo) {
            const queue = getQueue();
            const item = queue.find(q => q.qNo === qNo);
            if(item) {
                if(item.status==='Waiting') item.status='Consultation';
                else if(item.status==='Consultation') item.status='Completed';
                saveQueue(queue);
                renderDashboard();
            }
        }
        function removeQ(qNo) {
            saveQueue(getQueue().filter(q => q.qNo !== qNo));
            renderDashboard();
        }
        renderDashboard();
    </script>
</body>
</html>
