<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseClinic - EMR Consultation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>@media print { body * { visibility: hidden; } #printable, #printable * { visibility: visible; } #printable { position: absolute; left: 0; top: 0; width: 100%; } }</style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="bg-sky-500 text-white p-2 rounded-xl shadow-sm"><i class="fa-solid fa-house-medical text-lg"></i></div>
                <span class="font-bold text-lg text-slate-900">Pulse<span class="text-sky-500">Clinic</span></span>
            </a>
            <nav class="hidden md:flex items-center space-x-1">
                <a href="index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Home</a>
                <a href="dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Dashboard & Queue</a>
                <a href="registry.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Patient Registry</a>
                <a href="emr.html" class="px-3 py-2 rounded-lg text-sm font-medium text-sky-600 bg-sky-50">Consultation (EMR)</a>
                <a href="billing.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Billing & Cashier</a>
            </nav>
            <div class="text-xs font-semibold text-slate-800">Dr. Sarah Jenkins</div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="font-bold text-slate-900 border-b pb-3">Active Encounter</h3>
                <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Select Patient</label><select id="emr-patient" onchange="loadPatient()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"></select></div>
                <div class="bg-slate-50 p-4 rounded-lg space-y-2 text-xs text-slate-600 border">
                    <p><strong>Age/Gender:</strong> <span id="s-age">-</span></p>
                    <p><strong>Contact:</strong> <span id="s-contact">-</span></p>
                    <p><strong>Allergies:</strong> <span id="s-allergies" class="text-red-600 font-medium">-</span></p>
                </div>
                <hr>
                <div>
                    <h4 class="text-xs font-semibold uppercase text-slate-500 mb-2">Prescriptions</h4>
                    <div id="rx-list" class="space-y-2 text-xs"></div>
                    <div class="mt-3 flex gap-2"><input type="text" id="rx-input" placeholder="Medication..." class="flex-grow p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"><button onclick="addRx()" class="bg-slate-800 text-white px-3 py-2 rounded-lg text-xs">Add</button></div>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 flex flex-col justify-between">
                <div class="space-y-4">
                    <h3 class="font-bold text-slate-900 border-b pb-3">Clinical Notes</h3>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Subjective / Symptoms</label><textarea id="note-sub" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm"></textarea></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Objective / Vitals</label><textarea id="note-obj" rows="2" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm"></textarea></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Assessment / Diagnosis</label><input type="text" id="note-ass" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-sm"></div>
                </div>
                <div class="pt-4 border-t flex justify-end gap-3">
                    <button onclick="alert('Saved!')" class="bg-emerald-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium">Save</button>
                    <button onclick="openPrint()" class="bg-sky-500 text-white px-5 py-2.5 rounded-lg text-sm font-medium"><i class="fa-solid fa-print"></i> Print Rx</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Print Modal -->
    <div id="print-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full p-8 shadow-xl space-y-6">
            <div id="printable" class="p-6 space-y-4">
                <h2 class="text-xl font-bold">PulseClinic Outpatient Center</h2>
                <p class="text-xs text-slate-500">Sagpon, Daraga, Albay</p>
                <hr>
                <p><strong>Patient:</strong> <span id="p-name-out"></span></p>
                <p><strong>Diagnosis:</strong> <span id="p-diag-out"></span></p>
                <div><strong>Rx:</strong><ul id="p-rx-out" class="list-disc list-inside text-sm"></ul></div>
            </div>
            <div class="flex justify-end gap-2"><button onclick="document.getElementById('print-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-100 rounded-lg">Close</button><button onclick="window.print()" class="px-4 py-2 bg-sky-500 text-white rounded-lg">Print</button></div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        let rx = ['Paracetamol 500mg 1 tab'];
        function initEMR() {
            const patients = getPatients();
            document.getElementById('emr-patient').innerHTML = patients.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            loadPatient();
            renderRx();
        }
        function loadPatient() {
            const p = getPatients().find(x => x.id == document.getElementById('emr-patient').value);
            if(p) {
                document.getElementById('s-age').innerText = `${p.age} yrs / ${p.gender}`;
                document.getElementById('s-contact').innerText = p.contact;
                document.getElementById('s-allergies').innerText = p.history;
            }
        }
        function addRx() {
            const val = document.getElementById('rx-input').value;
            if(val) { rx.push(val); document.getElementById('rx-input').value=''; renderRx(); }
        }
        function renderRx() {
            document.getElementById('rx-list').innerHTML = rx.map((item, i) => `<div class="flex justify-between bg-slate-50 p-2 rounded"><span>• ${item}</span><button onclick="rx.splice(${i},1);renderRx()" class="text-red-500">×</button></div>`).join('');
        }
        function openPrint() {
            const p = getPatients().find(x => x.id == document.getElementById('emr-patient').value);
            document.getElementById('p-name-out').innerText = p ? p.name : '';
            document.getElementById('p-diag-out').innerText = document.getElementById('note-ass').value;
            document.getElementById('p-rx-out').innerHTML = rx.map(r => `<li>${r}</li>`).join('');
            document.getElementById('print-modal').classList.remove('hidden');
        }
        initEMR();
    </script>
</body>
</html>
