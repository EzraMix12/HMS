<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseClinic - Patient Registry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="bg-sky-500 text-white p-2 rounded-xl shadow-sm"><i class="fa-solid fa-house-medical text-lg"></i></div>
                <span class="font-bold text-lg text-slate-900">Pulse<span class="text-sky-500">Clinic</span></span>
            </a>
            <nav class="hidden md:flex items-center space-x-1">
                <a href="index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Home</a>
                <a href="dashboard.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Dashboard & Queue</a>
                <a href="registry.html" class="px-3 py-2 rounded-lg text-sm font-medium text-sky-600 bg-sky-50">Patient Registry</a>
                <a href="emr.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Consultation (EMR)</a>
                <a href="billing.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-sky-600 hover:bg-slate-50">Billing & Cashier</a>
            </nav>
            <div class="text-xs font-semibold text-slate-800">Dr. Sarah Jenkins</div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-900">Patient Registry Directory</h2>
                <button onclick="openModal()" class="bg-sky-500 hover:bg-sky-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-xs"></i> Register Patient
                </button>
            </div>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold border-b border-slate-200">
                        <th class="p-4">ID</th><th class="p-4">Full Name</th><th class="p-4">Age / Gender</th><th class="p-4">Contact</th><th class="p-4">History / Allergies</th><th class="p-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="patient-tbody" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal -->
    <div id="patient-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3"><h3 class="font-bold text-slate-900">Register New Patient</h3><button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div>
            <form onsubmit="savePatient(event)" class="space-y-3 text-sm">
                <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Full Name</label><input type="text" id="p-name" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Age</label><input type="number" id="p-age" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Gender</label><select id="p-gender" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg"><option>Male</option><option>Female</option></select></div>
                </div>
                <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Contact Number</label><input type="text" id="p-contact" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg"></div>
                <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Allergies / History</label><textarea id="p-history" rows="2" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg"></textarea></div>
                <div class="pt-3 flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 rounded-lg">Cancel</button><button type="submit" class="px-4 py-2 bg-sky-500 text-white rounded-lg">Save</button></div>
            </form>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        function renderPatients() {
            const patients = getPatients();
            const tbody = document.getElementById('patient-tbody');
            tbody.innerHTML = patients.map(p => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-mono text-xs text-slate-500">#PAT-${p.id}</td>
                    <td class="p-4 font-medium">${p.name}</td>
                    <td class="p-4 text-slate-600">${p.age} yrs / ${p.gender}</td>
                    <td class="p-4 text-slate-600">${p.contact}</td>
                    <td class="p-4 text-slate-600">${p.history}</td>
                    <td class="p-4 text-right"><button onclick="deleteP(${p.id})" class="text-xs text-red-500"><i class="fa-solid fa-trash"></i></button></td>
                </tr>`).join('');
        }
        function openModal() { document.getElementById('patient-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('patient-modal').classList.add('hidden'); }
        function savePatient(e) {
            e.preventDefault();
            const patients = getPatients();
            patients.push({
                id: patients.length ? Math.max(...patients.map(p => p.id))+1 : 1,
                name: document.getElementById('p-name').value,
                age: parseInt(document.getElementById('p-age').value),
                gender: document.getElementById('p-gender').value,
                contact: document.getElementById('p-contact').value,
                history: document.getElementById('p-history').value || 'None'
            });
            savePatients(patients);
            closeModal();
            renderPatients();
        }
        function deleteP(id) {
            savePatients(getPatients().filter(p => p.id !== id));
            renderPatients();
        }
        renderPatients();
    </script>
</body>
</html>
